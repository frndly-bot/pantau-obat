# =============================================================================
# PostgreSQL 18 — tuning hemat resource untuk VPS 1 vCPU / 1 GB RAM
# Dipasang lewat bind mount ke /etc/postgresql/postgresql.conf.
# Container dibatasi 320 MB (lihat docker-compose.yml), jadi nilai di bawah
# sengaja kecil. Naikkan hanya setelah mengukur pemakaian nyata.
# =============================================================================

# ---- Koneksi ----
listen_addresses = '*'
port = 5432
# Aplikasi kecil; pool di backend cukup sedikit. Lebih banyak koneksi =
# lebih banyak memori terpakai per sesi.
max_connections = 20
superuser_reserved_connections = 2

# ---- Memori ----
# ~25% dari RAM VPS, tetapi dibatasi agar sisanya tetap lega untuk OS.
shared_buffers = 128MB
# Perkiraan cache OS untuk optimizer; tidak mengalokasikan memori.
effective_cache_size = 512MB
# Per operasi sort/hash. Kecil supaya banyak query paralel tidak swap.
work_mem = 4MB
maintenance_work_mem = 64MB
# Batasi worker paralel: VPS hanya punya 1 vCPU.
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_worker_processes = 4
max_parallel_maintenance_workers = 1

# ---- Write Ahead Log ----
# Kompresi WAL menghemat I/O dengan sedikit tambahan CPU.
wal_compression = on
# Batasi pertumbuhan WAL supaya checkpoint tidak mendadak.
max_wal_size = 512MB
min_wal_size = 80MB
# 1 vCPU: synchronous_commit tetap aman dan cukup cepat.
synchronous_commit = on
wal_level = replica
# 1 segmen WAL (16MB) sudah lebih dari cukup untuk beban ini.
wal_buffers = 16MB
checkpoint_completion_target = 0.9

# ---- Perencana query ----
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ---- Timeout ----
# Cegah koneksi/sesi menggantung menghabiskan slot.
idle_in_transaction_session_timeout = '5min'
idle_session_timeout = '30min'
statement_timeout = '30s'
lock_timeout = '10s'

# ---- Timezone ----
# Simpan absolut (TIMESTAMPTZ); zona tampilan diatur aplikasi per user.
timezone = 'UTC'
log_timezone = 'UTC'

# ---- Log ----
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = '1d'
log_rotation_size = '32MB'
log_min_duration_statement = '1000ms'   # catat query > 1 detik saja
log_checkpoints = on
log_connections = off                  # noise; nyalakan saat debug
log_disconnections = off
log_lock_waits = on
log_temp_files = '10MB'
log_autovacuum_min_duration = '0'

# ---- Autovacuum ----
# Tetap aktif; jangan dimatikan. Diramping agar cocok VPS kecil.
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = '60s'
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1
autovacuum_vacuum_cost_delay = '20ms'

# ---- Statistik ----
track_io_timing = on
track_functions = 'pl'
track_activity_query_size = 2048
