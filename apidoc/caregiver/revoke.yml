info:
  name: Cabut Akses Caregiver
  type: http
  seq: 6
  tags:
    - caregiver

http:
  method: DELETE
  url: "{{base_url}}/api/v1/care-links/{{care_link_id}}"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.access_removed
      operator: eq
      value: true

docs: |-
  # Cabut Akses Caregiver

  Mencabut relasi. Akses hilang **seketika**.

  ## Siapa yang boleh mencabut

  | Pihak | Boleh? |
  |---|---|
  | Pemilik data (pasien) | ya — berhak berhenti dipantau |
  | Caregiver | ya — berhak berhenti memantau |

  Keduanya menghasilkan status `revoked` yang sama.

  ## Akses hilang tanpa menunggu apa pun

  Karena `RequireAccess` dijalankan **setiap request**, permintaan berikutnya
  dari caregiver itu langsung ditolak. Tidak ada jeda selama tokennya masih
  hidup, dan tidak ada status di UI yang perlu disegarkan.

  Itu alasan pemeriksaan dilakukan ulang, bukan disimpan di sesi: pencabutan
  harus berlaku pada request berikutnya, bukan pada login berikutnya.

  ## Contoh response — 200

  ```json
  {"data": {"revoked": true, "access_removed": true}}
  ```

  ## Contoh response — 404

  ```json
  {"error": {"code": "NOT_FOUND", "message": "data tidak ditemukan"}}
  ```

  Muncul bila pemanggil bukan pemilik maupun caregiver pada relasi itu.

  Kontrak: `docs/design-v2/api-v2.md` bagian 9.