docs: |-
  # Pemeriksaan Kesehatan

  Folder ini dijalankan pada urutan ke-1 dalam satu kali
  run koleksi.

  `seq` di sini WAJIB ada. Bruno mengurutkan folder dengan
  `sortByNameThenSequence`: folder tanpa seq jatuh ke urutan alfabetis.
  Tanpa seq, `adherence/` dan `admin/` akan berjalan SEBELUM
  `authentication/`, sehingga `access_token` belum ada dan puluhan
  request menanggung 401 berantai.
