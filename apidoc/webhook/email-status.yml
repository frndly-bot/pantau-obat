info:
  name: Webhook Status Email
  type: http
  seq: 1
  tags:
    - webhook
    - smoke

http:
  method: POST
  url: "{{base_url}}/api/v1/webhooks/email-status"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Signature
      value: "{{email_webhook_signature}}"
    - name: X-Timestamp
      value: "{{email_webhook_timestamp}}"
  body:
    type: text
    data: "{{email_webhook_body}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.received
      operator: eq
      value: true
  scripts:
    - type: before-request
      code: |-
        // Tanda tangan HMAC dihitung dari BODY MENTAH yang persis sama dengan
        // yang dikirim.
        //
        // Body-nya bertipe `text`, BUKAN `json`. Itu disengaja: kalau
        // bertipe json, Bruno mengurai lalu menyusun ulang body-nya, dan
        // byte yang terkirim tidak lagi sama dengan byte yang ditandatangani
        // — server membalas 401 walau HMAC-nya benar. Dengan `text`, string
        // yang dikirim persis seperti yang ditulis di variabel ini.
        //
        // Kunci dan urutannya harus sama persis dengan yang ditandatangani:
        // provider_id, status, recipient, timestamp.
        const secret = bru.getEnvVar("email_webhook_secret") || bru.getVar("email_webhook_secret") || "";
        const body = JSON.stringify({
          provider_id: "msg_uji_e2e_001",
          status: "delivered",
          recipient: "uji@example.com",
          timestamp: "2026-10-11T10:00:00Z"
        });
        bru.setVar("email_webhook_body", body);
        console.log("DEBUG_BODY=" + body);

        // --- SHA-256 murni JS (tanpa pustaka) ---
        // Konstanta K resmi SHA-256 (kubus akar prima), bukan turunan sin().
        const K = [
          0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1,
          0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
          0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786,
          0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
          0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147,
          0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
          0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b,
          0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
          0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a,
          0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
          0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
        ];
        function utf8(str) {
          const out = [];
          for (let i = 0; i < str.length; i++) {
            let c = str.charCodeAt(i);
            if (c < 0x80) out.push(c);
            else if (c < 0x800) { out.push(0xC0 | (c >> 6), 0x80 | (c & 63)); }
            else { out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
          }
          return out;
        }
        function sha256(bytes) {
          const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
                     0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
          const len = bytes.length;
          const bitLen = len * 8;
          const msg = bytes.slice();
          msg.push(0x80);
          while (msg.length % 64 !== 56) msg.push(0);
          for (let i = 7; i >= 0; i--) msg.push((bitLen / Math.pow(2, i * 8)) & 0xff);
          const rr = (x, n) => (x >>> n) | (x << (32 - n));
          for (let off = 0; off < msg.length; off += 64) {
            const w = [];
            for (let i = 0; i < 16; i++) {
              w[i] = (msg[off + i*4] << 24) | (msg[off + i*4 + 1] << 16) |
                     (msg[off + i*4 + 2] << 8) | msg[off + i*4 + 3];
            }
            for (let i = 16; i < 64; i++) {
              const s0 = rr(w[i-15], 7) ^ rr(w[i-15], 18) ^ (w[i-15] >>> 3);
              const s1 = rr(w[i-2], 17) ^ rr(w[i-2], 19) ^ (w[i-2] >>> 10);
              w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
            }
            let [a, b, c, d, e, f, g, h] = H;
            for (let i = 0; i < 64; i++) {
              const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
              const ch = (e & f) ^ (~e & g);
              const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
              const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
              const maj = (a & b) ^ (a & c) ^ (b & c);
              const t2 = (S0 + maj) | 0;
              h = g; g = f; f = e; e = (d + t1) | 0;
              d = c; c = b; b = a; a = (t1 + t2) | 0;
            }
            H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0;
            H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0;
            H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
          }
          return H.map(x => ("00000000" + (x >>> 0).toString(16)).slice(-8)).join("");
        }
        function hexToBytes(hex) {
          const out = [];
          for (let i = 0; i < hex.length; i += 2) {
            out.push(parseInt(hex.slice(i, i + 2), 16));
          }
          return out;
        }
        function hmacSha256(key, msg) {
          let k = utf8(key);
          if (k.length > 64) k = hexToBytes(sha256(k));
          while (k.length < 64) k.push(0);
          const oKey = k.map(b => b ^ 0x5c);
          const iKey = k.map(b => b ^ 0x36);
          const inner = sha256(iKey.concat(utf8(msg)));
          // Digest berikutnya dipakai sebagai BYTE, bukan teks hex-nya.
          return sha256(oKey.concat(hexToBytes(inner)));
        }

        const hex = hmacSha256(secret, body);
        bru.setVar("email_webhook_signature", "sha256=" + hex);
        bru.setVar("email_webhook_timestamp", Math.floor(Date.now() / 1000).toString());

docs: |-
  # Webhook Status Email

  Menerima status pengiriman dari penyedia email. Kanal email dijadwalkan
  untuk **v0.2**; endpoint ini sudah ada supaya bentuknya tetap.

  ## Autentikasi: HMAC, BUKAN bearer

  Endpoint ini **tidak** memakai token. Yang datang bukan user, melainkan
  penyedia email, dan ia tidak punya sesi.

  Yang dipakai adalah tanda tangan HMAC-SHA256 dari **raw body**:

  ```
  X-Signature: sha256=<hmac_hex>
  ```

  | Header | Fungsi |
  |---|---|
  | `X-Signature` | Bukti keaslian body |
  | `X-Timestamp` | Menolak permintaan basi, toleransi ±5 menit |

  Tanda tangannya dihitung dari **body mentah**, bukan dari JSON yang sudah
  diurai. Mengurai lalu menyusun ulang akan mengubah urutan kunci dan spasi,
  dan tanda tangannya tidak akan cocok.

  ## Secret uji

  Secret diambil dari variabel environment `email_webhook_secret`, yang harus
  SAMA dengan `WEBHOOK_EMAIL_SECRET` di konfigurasi server. Kalau server tidak
  mengisi secret itu, endpoint membalas 500 "webhook belum diaktifkan" — itu
  perilaku yang benar, bukan bug koleksi.

  ## Replay ditolak

  `provider_id` bersifat unik. Permintaan yang sama dikirim dua kali tidak
  diproses dua kali — penting karena penyedia email sering mengirim ulang
  saat mereka tidak yakin laporannya sampai.

  ## Kenapa webhook tidak masuk kelompok terautentikasi

  Kalau didaftarkan di kelompok yang butuh bearer, ia akan ditolak
  `RequireAuth` **sebelum** sempat memverifikasi tanda tangannya. Karena itu
  ia punya kelompok sendiri, dengan mekanisme autentikasinya sendiri.

  ## Contoh response — 200

  ```json
  {"data": {"received": true}}
  ```

  ## Contoh response — 401

  ```json
  {
    "error": {
      "code": "UNAUTHENTICATED",
      "message": "tanda tangan webhook tidak sah"
    }
  }
  ```

  Kontrak: `docs/design-v2/api-v2.md` bagian 12.
