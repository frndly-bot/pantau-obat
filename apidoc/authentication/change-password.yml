info:
  name: Ganti Password
  type: http
  seq: 6
  tags:
    - authentication
    - smoke

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{access_token}}"
  body:
    type: json
    data: |-
      {
        "current_password": "KataSandi2026kuat",
        "new_password": "KataSandi2026lebihkuat"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.changed
      operator: eq
      value: true
  scripts:
    - type: after-response
      code: |-
        // Ganti password MENCABUT SELURUH akses, termasuk access token yang
        // sedang dipakai dan sesi refresh-nya. Itu perilaku yang benar —
        // orang mengganti password justru ketika mencurigai akunnya.
        //
        // Konsekuensinya untuk koleksi ini: 49 request sesudah titik ini
        // akan menanggung 401 kalau variabel token tidak diperbarui.
        // Solusinya login ulang dengan password BARU, dan simpan hasilnya
        // sebagai variabel yang sama supaya request berikutnya tetap jalan
        // tanpa diedit satu per satu.
        bru.setVar("current_password", "KataSandi2026lebihkuat");

docs: |-
  # Ganti Password

  Mengganti password, dan **mencabut seluruh akses** termasuk sesi yang
  sedang dipakai.

  ## Perangkat yang memicu juga terlempar keluar

  Itu memang disengaja. Orang mengganti password justru ketika mencurigai
  akunnya dipakai orang lain, jadi membiarkan sesi lain hidup akan
  menggagalkan tujuannya. User harus masuk ulang dengan password baru.

  ## Urutan di koleksi ini

  Setelah request ini lulus, **semua token tidak berlaku**. Koleksi karena
  itu menyimpan password baru ke `current_password`, dan request berikutnya
  (`seq 7`, login ulang) menukar password baru itu menjadi sesi yang hidup.
  Tanpa urutan ini, 49 request setelah titik ini akan gagal 401 — bukan
  karena backend salah, melainkan karena keamanannya bekerja.

  ## Pesan error yang spesifik

  Berbeda dari kebanyakan validasi, endpoint ini menyebut alasan yang tepat:

  | Keadaan | Pesan |
  |---|---|
  | Password lama salah | `password lama salah` |
  | Password baru sama | `password baru harus berbeda dari yang lama` |
  | Password baru lemah | `password minimal 8 karakter` |

  Untuk `ErrValidation`, pesan spesifik dari kode diteruskan. Untuk error
  lain, pesan tetap dipakai supaya detail internal tidak bocor.

  ## Contoh response — 200

  ```json
  {"data": {"changed": true, "other_sessions_revoked": true}}
  ```

  `other_sessions_revoked` dilaporkan walau sesi ini **juga** dicabut, karena
  klien perlu tahu token yang sedang dipakainya sudah tidak berlaku lagi.

  ## Contoh response — 400

  ```json
  {"error": {"code": "VALIDATION_FAILED", "message": "password lama salah"}}
  ```

  Kontrak: `docs/design-v2/api-v2.md` bagian 2.
